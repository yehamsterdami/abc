<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
 
  
  <link rel="manifest" href="manifest.json" />

  <title>CCLab Project</title>

  <link rel="stylesheet" type="text/css" href="style.css">


  <script src="lib/p5.js"></script>
  <script src="lib/mappa.js" type="text/javascript"></script>
  <script src="socket.io/socket.io.js"></script>

</head>

<body>

  <div class="main-wrapper">
    <!-- <h1>Project Title</h1> -->

  <div id="entry-screen">
    <div id="entry-box">
      <h2>Enter your name</h2>
      <input id="name-input" type="text" placeholder="Your name" />
      <button id="enter-btn" >Enter Map</button>
    </div>
  </div>

  <div id="mailbox-container">
    <img id="mailbox-button" src="mailbox.png" alt="mailbox">
    
    <div id="mailbox-popup">
        <div id="mailbox-header">Mailbox</div>
        <div id="mailbox-messages"></div>
    </div>
</div>



    <!-- the following div will contain the p5 canvas. -->
    <div id="p5-canvas-container">
      <!-- p5 canvas will be appended here. -->
    </div>
   


    <!-- <p>Project Description</p> -->
  </div>


  <!-- function to request orientation -->
  <script src="requestGPS.js"></script> 
  <!-- the script tag below should always be at the bottom, right before the closing body tag -->
  <script src="sketch.js"></script>

</html>
